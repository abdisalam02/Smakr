<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smakr — Map Pin Design Lab (10 Concepts)</title>
  <style>
    :root {
      --bg: #F7F4EE;
      --card-bg: #FFFFFF;
      --paprika: #E84A27;
      --espresso: #181615;
      --muted: #716B64;
      --border: #E8E2D8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Plus Jakarta Sans", sans-serif;
      background: var(--bg);
      color: var(--espresso);
      padding: 32px 20px 80px;
    }
    .header {
      max-width: 1200px;
      margin: 0 auto 32px;
    }
    .badge {
      display: inline-block;
      background: var(--paprika);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    p.subtitle {
      color: var(--muted);
      font-size: 14px;
      max-width: 700px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 14px rgba(24, 22, 21, 0.04);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card-num {
      color: var(--paprika);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
    }
    .card-title {
      font-size: 17px;
      font-weight: 700;
      margin-top: 2px;
    }
    .card-desc {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.4;
    }
    .preview-box {
      background: #F4F1EA;
      border-radius: 12px;
      border: 1px solid #E2DCD2;
      height: 180px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 10px;
    }
    .state-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 2;
    }
    .state-tag {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.05em;
      padding: 2px 6px;
      border-radius: 4px;
      background: #FFFFFF;
      color: var(--muted);
      border: 1px solid #DDD6C9;
    }
    .state-tag.selected {
      background: var(--paprika);
      color: #FFFFFF;
      border-color: var(--paprika);
    }
    .pin-target {
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .pin-target:hover {
      transform: scale(1.08);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge">DESIGN LAB</div>
    <h1>Map Pin Architecture: 10 Visual Concepts</h1>
    <p class="subtitle">Exploring alternatives to the thick uniform die-cut stroke and fixing arrow off-center alignment across all icon shapes.</p>
  </div>

  <div style="max-width: 1200px; margin: 0 auto 30px;">
    <img src="/map_pin_design_showcase.png" alt="Map Pin Showcase" style="width: 100%; border-radius: 16px; border: 1px solid #E8E2D8; box-shadow: 0 8px 24px rgba(24,22,21,0.08);" />
  </div>
</body>
</html>
