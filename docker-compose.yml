version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. PostgreSQL 16 with PostGIS Spatial Extension
  # -------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: citypulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-citypulse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citypulse_password}
      POSTGRES_DB: ${POSTGRES_DB:-citypulse_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-citypulse_user} -d ${POSTGRES_DB:-citypulse_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - citypulse-net

  # -------------------------------------------------------------
  # 2. Redis for Pub/Sub and Ephemeral Check-In TTLs
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: citypulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - citypulse-net

  # -------------------------------------------------------------
  # 3. FastAPI Backend Service (Python 3.11/3.12 + AsyncIO + WebSockets)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: citypulse-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-citypulse_user}:${POSTGRES_PASSWORD:-citypulse_password}@db:5432/${POSTGRES_DB:-citypulse_db}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    networks:
      - citypulse-net

  # -------------------------------------------------------------
  # 4. Next.js 15 Interactive Map Radar Frontend
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: citypulse-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/api/v1/ws/live
    ports:
      - "3000:3000"
    networks:
      - citypulse-net

volumes:
  postgres_data:
  redis_data:

networks:
  citypulse-net:
    driver: bridge
